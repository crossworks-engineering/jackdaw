# Builds + pushes the owner-UI image on every release tag. The image keeps the
# `mantle-client` name so the fleet's compose files don't change at the split;
# tags: the jackdaw version + `latest`.
#
# Needs DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repo secrets; skips cleanly
# until they exist.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  client-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check for Docker Hub credentials
        id: creds
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$U" ]; then echo "have=true" >> "$GITHUB_OUTPUT";
          else echo "have=false" >> "$GITHUB_OUTPUT"; echo "::notice::DOCKERHUB_* secrets not set — skipping image push"; fi

      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.have == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.have == 'true'
      - uses: docker/login-action@v3
        if: steps.creds.outputs.have == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push
        if: steps.creds.outputs.have == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: client
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.MANTLE_IMAGE_NAMESPACE || 'titanwest' }}/mantle-client:${{ github.ref_name }}
            ${{ vars.MANTLE_IMAGE_NAMESPACE || 'titanwest' }}/mantle-client:latest
          build-args: |
            MANTLE_GIT_SHA=${{ github.sha }}
            MANTLE_BUILD_TIME=${{ github.event.head_commit.timestamp }}
